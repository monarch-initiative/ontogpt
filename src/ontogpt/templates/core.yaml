id: http://w3id.org/ontogpt/core
name: core
title: AI core Template
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  RO: http://purl.obolibrary.org/obo/RO_
  biolink: https://w3id.org/biolink/vocab/
  core: http://w3id.org/ontogpt/core/
  linkml: https://w3id.org/linkml/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
description: Core upper level

default_prefix: core
default_range: string

imports:
  - linkml:types

classes:
  Any:
    class_uri: linkml:Any

  ExtractionResult:
    description: >-
      A result of extracting knowledge on text
    attributes:
      input_id:
      input_title:
      input_text:
      raw_completion_output:
      prompt:
      extracted_object:
        description: >-
          The complex objects extracted from the text
        range: Any
        inlined: true
      named_entities:
        description: >-
          Named entities extracted from the text
        range: Any
        multivalued: true
        inlined: true
        inlined_as_list: true
      validation:
        description: >-
          Results of validating the grounded terms in the extracted object
          against their source ontologies, including any replacements made.
          Absent when validation was not run.
        range: TermValidationReport
        inlined: true

  TermValidationReport:
    description: >-
      Summary of ontology term validation performed on an extraction result.
      Each grounded identifier in the extracted object is checked for existence
      and obsolescence in its ontology and for agreement between the extracted
      label and the ontology's label or synonyms. Invalid identifiers are
      replaced when a valid substitute can be found.
    attributes:
      validator:
        description: Name and version of the validation library used
      total_terms:
        description: Number of grounded identifiers examined
        range: integer
      valid_terms:
        description: Identifiers that resolved with a matching label or synonym
        range: integer
      replaced_terms:
        description: Identifiers replaced with a valid substitute
        range: integer
      unresolved_terms:
        description: >-
          Invalid identifiers for which no substitute was found; these are
          rewritten with the auto prefix so that no invalid identifier remains
        range: integer
      label_mismatches:
        description: >-
          Identifiers that resolved but whose extracted label is neither the
          ontology label nor a known synonym; kept as they are
        range: integer
      skipped_terms:
        description: Identifiers that could not be checked because no ontology adapter was available
        range: integer
      results:
        description: One entry per examined identifier
        range: TermValidationResult
        multivalued: true
        inlined: true
        inlined_as_list: true

  TermValidationResult:
    description: Outcome of validating one grounded identifier.
    attributes:
      original_id:
        description: The identifier as produced by grounding
      label:
        description: The label extracted from the text for this identifier
      entity_class:
        description: The template class the identifier was grounded for
      status:
        range: TermValidationStatus
      ontology_label:
        description: The label of the original identifier in its ontology, when it resolved
      replacement_id:
        description: The identifier substituted into the output, if any
      replacement_label:
        description: The ontology label of the replacement identifier
      message:
        description: Human-readable explanation of the outcome
      attempts:
        description: Candidate identifiers considered while searching for a replacement
        multivalued: true

  NamedEntity:
    abstract: true
    attributes:
      id:
        description: >-
          A unique identifier for the named entity
        comments:
          - this is populated during the grounding and normalization step
        identifier: true
        annotations:
          prompt.skip: "true"
      label:
        aliases:
          - name
        description: >-
          The label (name) of the named thing
        range: string
        slot_uri: rdfs:label
        annotations:
          owl: AnnotationProperty, AnnotationAssertion
      original_spans:
        description: >-
          The coordinates of the original text span from which the named entity
          was extracted, inclusive. For example, "10:25" means the span starting
          from the 10th character and ending with the 25th character. The first
          character in the text has index 0. Newlines are treated as single
          characters. Multivalued as there may be multiple spans for a single
          text.
        comments:
          - This is determined during grounding and normalization
          - But is based on the full input text
        range: string
        multivalued: true
        pattern: "^\\d+:\\d+$"
        annotations:
          prompt.skip: "true"

  CompoundExpression:
    abstract: true

  Triple:
    abstract: true
    description: Abstract parent for Relation Extraction tasks
    is_a: CompoundExpression
    attributes:
      subject:
        range: NamedEntity
      predicate:
        range: RelationshipType
      object:
        range: NamedEntity
      qualifier:
        range: string
        description: >-
          A qualifier for the statements, e.g. "NOT" for negation
      subject_qualifier:
        range: NamedEntity
        description: >-
          An optional qualifier or modifier for the subject of the statement, e.g. "high dose" or "intravenously administered"
      object_qualifier:
        range: NamedEntity
        description: >-
          An optional qualifier or modifier for the object of the statement, e.g. "severe" or "with additional complications"

  TextWithTriples:
    description: A text containing one or more relations of the Triple type.
    attributes:
      publication:
        range: Publication
        inlined: true
        annotations:
          prompt.skip: "true"
      triples:
        range: Triple
        multivalued: true
        inlined: true
        inlined_as_list: true

  TextWithEntity:
    description: A text containing one or more instances of a single type of entity.
    attributes:
      publication:
        range: Publication
        inlined: true
        annotations:
          prompt.skip: "true"
      entities:
        range: NamedEntity
        multivalued: true

  RelationshipType:
    is_a: NamedEntity
    id_prefixes:
      - RO
      - biolink

  Publication:
    attributes:
      id:
        description: >-
          The publication identifier
      title:
        description: >-
          The title of the publication
      abstract:
        description: >-
          The abstract of the publication
      combined_text:
      full_text:
        description: >-
          The full text of the publication

  AnnotatorResult:
    attributes:
      subject_text:
      object_id:
      object_text:

enums:

  TermValidationStatus:
    description: Outcome categories for ontology term validation.
    permissible_values:
      VALID:
        description: The identifier resolves and the extracted label is its label or a synonym
      LABEL_DIFFERS:
        description: The identifier resolves but the extracted label is neither its label nor a synonym
      REPLACED:
        description: The identifier was invalid or obsolete and a valid substitute was found
      UNRESOLVED:
        description: The identifier was invalid and no substitute was found; the value was rewritten with the auto prefix
      SKIPPED:
        description: The identifier could not be checked because no ontology adapter was available for its prefix

  NullDataOptions:
    permissible_values:
      UNSPECIFIED_METHOD_OF_ADMINISTRATION:
        meaning: NCIT:C149701
      NOT_APPLICABLE:
        meaning: NCIT:C18902
        aliases:
          - "not applicable"
          - "N/A"
      NOT_MENTIONED:
